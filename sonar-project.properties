# SonarQube Project Configuration
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/overview/

sonar.projectKey=nameerhqureshi_121-platform
sonar.organization=nameerhqureshi

# Source files configuration
sonar.sources=services/121-service/src,interfaces/portal/src,services/mock-service/src
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**,**/build/**

# Test files configuration
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/javascript-typescript-test-coverage/
sonar.tests=services/121-service/src,interfaces/portal/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# TypeScript/JavaScript specific settings
sonar.javascript.lcov.reportPaths=**/coverage/**/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Performance
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts
sonar.skipPackageDesignAnalysis=true
