# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

# Keep this workflow aligned with the proven QLTY workflows to prevent CI drift.
# Can't use the top-level "paths" filter because of issues with required checks.
# See: https://github.com/orgs/community/discussions/44490#discussioncomment-10253645

name: 'SonarQube Cloud Analysis'

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  backendPath: services/121-service
  frontendPath: interfaces/portal

jobs:
  path-filter:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.filter.outputs.should_skip }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          filter: blob:none
          fetch-depth: 0

      - uses: leavesster/pull-request-path-filter@v0.2
        if: github.event_name == 'pull_request'
        id: 'filter'
        with:
          paths: |
            - .github/workflows/sonarqube-analysis.yml
            - .github/actions/build-service/action.yml
            - services/.env.example
            - interfaces/portal/**
            - services/121-service/**
            - services/mock-service/**
            - '!**.md'

  backend-integration-coverage-shard:
    runs-on: ubuntu-latest
    needs: path-filter
    if: ${{ needs.path-filter.outputs.should_skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4', '5', '6']
        shardCount: ['6']
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set ENV-variables for test-environment
        run: |
          cp ./services/.env.example services/.env
          grep -v "^#\|^$" services/.env.example >> $GITHUB_ENV
          echo "COVERAGE_DEV_STARTUP_SUFFIX=:collect-coverage" >> $GITHUB_ENV

      - name: Run Services with Docker
        run: npm run start:services:ci

      - name: Run integration tests (inside Docker-container)
        working-directory: ${{ env.backendPath }}
        run: |
          docker compose exec 121-service npm run test:integration:all -- --shard=${{ matrix.shard }}/${{ matrix.shardCount }}

      - name: Generate coverage-report from 121-service
        working-directory: ${{ env.backendPath }}
        run: |
          curl --data "{\"secret\":\"$RESET_SECRET\"}" \
               --header "Content-Type: application/json" \
               --request POST "$EXTERNAL_121_SERVICE_URL/api/test/kill-service" || true
          docker compose exec 121-service npm run coverage:report:integration

      - uses: actions/upload-artifact@v7
        with:
          name: integration-test-coverage-report-${{ matrix.shard }}
          path: ${{ env.backendPath }}/coverage

      - name: Docker logs
        if: always()
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e

  backend-unit-coverage:
    runs-on: ubuntu-latest
    needs: path-filter
    if: ${{ needs.path-filter.outputs.should_skip != 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: '${{ env.backendPath }}/.node-version'
          cache: 'npm'
          cache-dependency-path: '${{ env.backendPath }}/package-lock.json'

      - name: Set ENV-variables for test-environment
        run: |
          cp ./services/.env.example services/.env
          grep -v "^#\|^$" services/.env.example >> $GITHUB_ENV

      - name: Install
        working-directory: ${{ env.backendPath }}
        run: npm ci

      - name: Run unit tests
        working-directory: ${{ env.backendPath }}
        run: npm run test:unit:coverage

      - uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage-report
          path: ${{ env.backendPath }}/coverage

  frontend-coverage:
    runs-on: ubuntu-latest
    needs: path-filter
    if: ${{ needs.path-filter.outputs.should_skip != 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: '${{ env.frontendPath }}/.node-version'
          cache: 'npm'
          cache-dependency-path: '${{ env.frontendPath }}/package-lock.json'

      - name: Install
        working-directory: ${{ env.frontendPath }}
        run: npm ci

      - name: Test frontend with coverage
        working-directory: ${{ env.frontendPath }}
        run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: ${{ env.frontendPath }}/coverage

  sonarqube-analysis:
    runs-on: ubuntu-latest
    needs:
      [
        path-filter,
        backend-integration-coverage-shard,
        backend-unit-coverage,
        frontend-coverage,
      ]
    if: ${{ needs.path-filter.outputs.should_skip != 'true' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage reports from previous jobs
        uses: actions/download-artifact@v8
        with:
          path: coverage

      - name: Validate coverage files
        run: |
          test -f coverage/unit-test-coverage-report/unit/lcov.info
          test -f coverage/frontend-coverage-report/portal/lcov.info
          find coverage -name lcov.info | sort | head -40

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=services/121-service/src,interfaces/portal/src,services/mock-service/src
            -Dsonar.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**
            -Dsonar.tests=services/121-service/src,interfaces/portal/src
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts
            -Dsonar.typescript.lcov.reportPaths=coverage/**/lcov.info
            -Dsonar.sourceEncoding=UTF-8

      - name: Save combined coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-coverage-reports
          path: coverage
          retention-days: 7
